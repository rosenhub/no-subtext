name: Rule proposal
description: Propose a new rule or a change to one of the 12
labels: [rule]
body:
  - type: textarea
    id: before
    attributes:
      label: Before
      description: A real response you got from an agent. Paste it exactly.
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: After
      description: What it should have said instead.
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who does this help, in one sentence?
    validations:
      required: true
  - type: dropdown
    id: which
    attributes:
      label: Which rule does this change?
      options: ["1 Answer first", "2 No idioms", "3 No sarcasm", "4 No hints or hedging", "5 Required/Optional", "6 Misunderstanding repair", "7 Assumptions", "8 One question", "9 Exact numbers", "10 No filler", "11 Structure", "12 I don't know", "New rule (say which one it replaces)"]
    validations:
      required: true
